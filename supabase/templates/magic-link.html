<!doctype html>
<html lang="en">
  <body style="margin:0;padding:32px;background:#f4f5f0;color:#22231f;font-family:Arial,sans-serif;">
    <div style="max-width:560px;margin:0 auto;padding:30px;border:1px solid #c8cbc2;border-radius:6px;background:#ffffff;">
      <p style="margin:0;color:#356f68;font-size:12px;font-weight:700;text-transform:uppercase;">Science Studio</p>
      <h1 style="margin:14px 0 0;font-size:26px;line-height:1.2;">Sign in to your teacher account</h1>
      <p style="margin:14px 0 0;color:#666a61;font-size:14px;line-height:1.6;">Use the secure one-time link below to continue. It expires after one hour and can only be used once.</p>
      <p style="margin:24px 0 0;"><a href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=email" style="display:inline-block;padding:13px 18px;border-radius:5px;background:#1d1e1b;color:#ffffff;font-size:13px;font-weight:700;text-decoration:none;">Sign in to Science Studio</a></p>
      <p style="margin:24px 0 0;color:#8a8e84;font-size:11px;line-height:1.5;">If you did not request this email, you can safely ignore it.</p>
    </div>
  </body>
</html>
