services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: science_studio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./:/workspace:ro
      - science-studio-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d science_studio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  science-studio-postgres-data:
